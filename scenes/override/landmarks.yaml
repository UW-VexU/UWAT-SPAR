  # for the portable perimeter (11.54 in); the metal perimeter is 11.50 in.
  corner_red_far: [-1.7832, 1.7832, 0.0]
  corner_red_near: [-1.7832, -1.7832, 0.0]
  corner_blue_far: [1.7832, 1.7832, 0.0]
  corner_blue_near: [1.7832, -1.7832, 0.0]
  corner_red_far_top: [-1.7832, 1.7832, 0.2931]
  corner_red_near_top: [-1.7832, -1.7832, 0.2931]
  corner_blue_far_top: [1.7832, 1.7832, 0.2931]
  corner_blue_near_top: [1.7832, -1.7832, 0.2931]
  # Corners of the Midfield tape square, on the tape centerline.
  midfield_red: [-0.5981, 0.0, 0.0]
  midfield_blue: [0.5981, 0.0, 0.0]
  midfield_far: [0.0, 0.5981, 0.0]
  midfield_near: [0.0, -0.5981, 0.0]
