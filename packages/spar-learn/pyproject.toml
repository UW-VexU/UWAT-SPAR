[project]
name = "spar-learn"
version = "0.1.0"
description = "Behavior cloning, multi-agent RL, strategy search"
requires-python = ">=3.12"
dependencies = [
    "spar-schema",
    "spar-sim",
    "typer>=0.12",
]
# Planned (spec section 10): jaxmarl, ribs (pyribs), hydra-core, onnx

[tool.uv.sources]
spar-schema = { workspace = true }
spar-sim = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
