[project]
name = "spar-sim"
version = "0.1.0"
description = "Plan-level simulator (JAX)"
requires-python = ">=3.12"
dependencies = [
    "spar-schema",
    "typer>=0.12",
]
# Planned (spec section 10): jax (CUDA), pettingzoo

[tool.uv.sources]
