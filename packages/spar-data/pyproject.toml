[project]
name = "spar-data"
version = "0.1.0"
description = "Dataset catalog and converters"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "spar-schema",
    "typer>=0.12",
]
# Planned (spec section 10): lerobot, pettingzoo, huggingface_hub; low priority: tensorflow-datasets, flashbax

[tool.uv.sources]
spar-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
