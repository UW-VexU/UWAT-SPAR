[project]
name = "spar-perception"
version = "0.1.0"
description = "Auto-labeling, detector training, tracking, field calibration"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "scipy>=1.18.1",
    "spar-schema",
    "supervision>=0.31.3",
    "trackers>=2.6.1",
    "typer>=0.12",
]
# Planned (spec section 10): torch (CUDA 12.8+), transformers, rfdetr, trackers, supervision, opencv-python; `baselines` extra (AGPL): ultralytics, boxmot

[tool.uv.sources]
spar-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
