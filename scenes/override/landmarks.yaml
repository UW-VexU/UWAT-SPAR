# Named field points for calibration, in the field frame (m): origin at the field center, x toward
# the blue Alliance Station, y away from the audience, z up (see scene.yaml). From the Appendix A
# drawings. The physics repo's field landmarks must match these within 1 cm (spec section 8).
landmarks:
