[project]
name = "spar-sim"
version = "0.1.0"
description = "Plan-level simulator (JAX)"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "pettingzoo>=1.24",
    "spar-schema",
    "typer>=0.12",
]
# On the lab GPU, install the CUDA build of jax in the same environment as PyTorch (spec section 9).

[tool.uv.sources]
spar-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
