[project]
name = "spar-cli"
version = "0.1.0"
description = "The single spar command, mounting every package's subcommands"
requires-python = ">=3.12"
dependencies = [
    "spar-ingest",
    "spar-perception",
    "spar-state",
    "spar-data",
    "spar-gt",
    "spar-sim",
    "spar-learn",
    "spar-eval",
    "typer>=0.12",
]

[tool.uv.sources]
spar-ingest = { workspace = true }
spar-perception = { workspace = true }
spar-state = { workspace = true }
spar-data = { workspace = true }
spar-gt = { workspace = true }
spar-sim = { workspace = true }
spar-learn = { workspace = true }
spar-eval = { workspace = true }

[project.scripts]
spar = "spar_cli.main:app"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
