# A small, complete scene for the spar-schema tests. Not a real game.
scene: toy
rules_version: v1
schema_version: 0.1.0
manual: null

field:
  size_m: [2.0, 2.0]
  frame: {origin: field_center, x_axis: toward_blue}
  landmarks: landmarks.yaml
  regions:
    zone: [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]]

programs:
  solo:
    teams_per_alliance: 1
    robots_per_alliance: 1
    autonomous_s: 10
    driver_s: 50

timing: {}

agents:
  classes: [robot]
  alliances: [red, blue]
  our_robots: robot_limits.yaml

objects:
  ball: {count: 4}
  goal:
    count: 2
    instances:
      red: {xy: [-0.8, 0.0]}
      blue: {xy: [0.8, 0.0]}

objective:
  module: scoring.py
  function: score
  checkpoints: [autonomous_end, match_end]
  checkpoint_at:
    autonomous_end: {after: autonomous}
    match_end: {after: driver, delay_s: 2}
  points: {ball: 1}

prompts:
  robot: "a robot"
  ball: "a ball"

strategy_code: strategy_code.yaml

plugins:
  state: state.py:build_state
  actions: sim.py:infer_action
  sim: sim.py:rules

state:
  dims:
    alliance: [red, blue]
    slot: 3
  fields:
    points: {dims: [alliance], dtype: int16}
    holder: {dims: [slot], dtype: int8, values: [nobody, red, blue]}
    over: {dtype: bool}

# A robot picks up a ball and drops it in a goal; either goal counts for the alliance it is named
# after.
sim:
  items: [ball]
  carry: 1
  standoff_m: 0.2
  actions:
    idle: {}
    pick: {args: {item: items}}
    place: {args: {goal: goal}, to: goal}
    park: {to: zone}
