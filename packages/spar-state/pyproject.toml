[project]
name = "spar-state"
version = "0.1.0"
description = "Task state, score check, events, strategy codes"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "rapidfuzz>=3.14.6",
    "spar-schema",
    "typer>=0.12",
]
# Planned (spec section 10): numpy, rapidfuzz, scikit-learn; torch for the learned event model

[tool.uv.sources]
spar-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"
